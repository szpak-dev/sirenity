[build-system]
requires = ["hatchling>=1.28", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "sirenity"
dynamic = ["version"]
description = "Compile OpenAPI API graphs into Siren hypermedia documents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "9orky" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

dependencies = [
    "gherkin-official>=29",
    "jsonschema[format-nongpl]>=4.26",
    "openapi-spec-validator>=0.9,<1",
    "pydantic>=2.12",
    "wireup>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.3",
    "django>=5.1,<6.1",
    "django-ninja-extra>=0.30,<1",
    "fastapi>=0.115,<1",
    "modwire-cli>=2.0.0",
    "packaging>=25",
    "pytest>=9",
    "pytest-bdd>=8.1,<9",
    "ruff>=0.14",
    "twine>=7",
]

[dependency-groups]
dev = [
    "build>=1.3",
    "django>=5.1,<6.1",
    "django-ninja-extra>=0.30,<1",
    "fastapi>=0.115,<1",
    "modwire-cli>=2.0.0",
    "packaging>=25",
    "pytest>=9",
    "pytest-bdd>=8.1,<9",
    "ruff>=0.14",
    "twine>=7",
]

[project.urls]
Repository = "https://github.com/szpak-dev/sirenity"
Issues = "https://github.com/szpak-dev/sirenity/issues"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/sirenity/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sirenity"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
cache_dir = ".dump/pytest-cache"
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
cache-dir = ".dump/ruff-cache"
line-length = 120
extend-exclude = ["**/_version.py"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
