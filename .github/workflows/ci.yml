name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.dump/uv-cache
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.dump/pycache

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      - run: make verify-fast

  quality:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --python 3.12
      - run: make quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-package-artifacts
          path: dist/quality/
          if-no-files-found: warn
